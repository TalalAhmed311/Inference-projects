worker_processes auto;
events { worker_connections 1024; }

http {
    upstream tiny_engines {
        least_conn;
        server engine-1:8001;
        # server engine-2:8001;
    }

    # Optional rate limit (uncomment to enable):
    # limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    server {
        listen 8080;

        location /health {
            proxy_pass http://tiny_engines/health;
        }

        location /metrics {
            proxy_pass http://tiny_engines/metrics;
        }

        location /v1/ {
            # limit_req zone=api burst=100 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_pass http://tiny_engines;
        }
    }
}
