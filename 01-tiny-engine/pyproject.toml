[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-engine"
version = "0.1.0"
description = "A small LLM inference engine built around Hugging Face Qwen2 weights (LLM Inference Lab, Stage 2)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.56",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.40"]

[tool.setuptools.packages.find]
include = ["tiny_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a real model download (set TINY_SKIP_MODEL_TESTS=1 to skip)"]
